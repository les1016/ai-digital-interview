name: Appointment business regression tests
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  appointment-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: development
      DATABASE_URL: 'sqlite:///:memory:'
      JWT_SECRET: CHANGE_APPOINTMENT_CI_ONLY_NOT_PRODUCTION
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      DEEPSEEK_API_KEY: ''
      DEEPSEEK_MOCK_MODE: '1'
      REDIS_URL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: |
          python -m pip install --only-binary=:all: uv==0.12.23
          uv sync --locked --python 3.12
      - name: Test booking, check-in and reports with temporary SQLite and synthetic data
        run: uv run --no-sync --offline python -m unittest discover -s tests -p 'test_appointment*.py' -v

  appointment-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Test booking UI rules and session requests
        run: node --test tests/appointment_ui.test.mjs tests/api_session.test.mjs
      - name: Build the exported frontend against local fixture routes
        env:
          VITE_API_BASE_URL: /api
          VITE_LIVETALKING_URL: /avatar
        run: |
          npx --yes pnpm@11.9.0 --dir apps/web install --frozen-lockfile
          npx --yes pnpm@11.9.0 --dir apps/web build
      - name: Install Chromium for the local browser fixture
        run: |
          npm install --prefix "$RUNNER_TEMP/appointment-playwright" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/appointment-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test expired report entry and slow recorder upload with simulated devices
        run: NODE_PATH="$RUNNER_TEMP/appointment-playwright/node_modules" node --test tests/appointment_room.browser.cjs

  appointment-rtc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lipku/LiveTalking
          ref: a5a77f4c395c8347789a16da1843cd1b08b48eea
          path: integrations/LiveTalking
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Apply the published LiveTalking adapter patch
        run: |
          git -C integrations/LiveTalking apply --check "$GITHUB_WORKSPACE/release/patches/livetalking-local.patch"
          git -C integrations/LiveTalking apply "$GITHUB_WORKSPACE/release/patches/livetalking-local.patch"
      - name: Test initialization deadlines without models or GPU
        run: |
          python -m pip install --only-binary=:all: aiohttp==3.14.5
          python -B - <<'PY'
          import unittest

          loader = unittest.TestLoader()
          loader.testNamePatterns = ["*offer_initialization*"]
          suite = loader.discover("tests", pattern="test_avatar_access.py")
          if not suite.countTestCases():
              raise SystemExit("No RTC initialization tests collected")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped))
          PY
